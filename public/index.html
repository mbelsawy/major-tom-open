<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211f1d">
<title>Major Tom</title>
<style>
  :root{
    --bg:#2b2a27; --sidebar:#211f1d; --card:#333230; --card2:#242320; --line:#413f3b;
    --fg:#ecebe4; --dim:#9b968b; --accent:#d97757; --accent-soft:rgba(217,119,87,.16);
    --ok:#7bb07e; --danger:#cf6a5c; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .hide{display:none!important}
  .hostb{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px;text-transform:uppercase;white-space:nowrap}
  button{font-family:inherit}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .btn:hover{border-color:#54514c} .btn:active{transform:scale(.98)} .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#2b1a12}
  .btn.pri:hover{background:#e0866a} .btn.ghost{background:transparent}
  .btn.danger{color:var(--danger);border-color:#4a312d;background:transparent}
  .btn.sm{padding:7px 10px;font-size:12px}
  input,select{background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:10px;font-size:15px;width:100%;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  label.fld{display:block;font-size:12px;color:var(--dim);margin:0 0 5px}
  .mini{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;font-weight:600}
  .sw{position:relative;width:42px;height:25px;flex:0 0 auto}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw .track{position:absolute;inset:0;background:#4a4844;border-radius:999px;transition:.15s}
  .sw .track::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}
  .sw input:checked+.track{background:var(--accent)}
  .sw input:checked+.track::after{transform:translateX(17px)}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:9px 0}
  .pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.4px}
  .pill.on{background:rgba(123,176,126,.18);color:#8fc292} .pill.off{background:rgba(155,150,139,.16);color:var(--dim)}
  .pill.cl{background:var(--accent-soft);color:#e69376}

  /* auth */
  #authScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
  .authbox{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
  .authbox .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#2b1a12;font-weight:800;font-size:18px;margin-bottom:14px}
  .authbox h1{font-size:19px;margin:0 0 4px} .authbox p{color:var(--dim);font-size:13px;margin:0 0 16px}

  /* layout — Claude Desktop proportions */
  .layout{display:flex;height:100dvh;overflow:hidden}
  .sidebar{width:270px;flex:0 0 auto;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px}
  .brand{display:flex;align-items:center;gap:9px;padding:8px 8px 12px}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#2b1a12;font-weight:800;font-size:15px}
  .brand .t{font-weight:650;font-size:14.5px} .brand .h{color:var(--dim);font-size:10.5px;margin-top:1px}
  .newbtn{width:100%;justify-content:flex-start;margin:2px 0 10px;background:transparent;border:1px solid var(--line)}
  .newbtn:hover{background:var(--card)}
  .list{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
  .sec-label{color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 8px 6px}
  /* sidebar toolbar — search / power filter / group / sort */
  .tools{padding:0 4px 8px;display:flex;flex-direction:column;gap:6px}
  .search{position:relative}
  .search input{width:100%;padding:7px 26px 7px 26px;font-size:13px;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--fg)}
  .search .mag{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:12px;pointer-events:none}
  .search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:6px}
  .search .clr:hover{color:var(--fg);background:var(--card)}
  .chips{display:flex;gap:4px}
  .chip{flex:1;text-align:center;font-size:11px;font-weight:600;padding:5px 0;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-family:inherit}
  .chip:hover{background:var(--card);color:var(--fg)}
  .chip.on{background:var(--accent-soft);border-color:transparent;color:#f0c3b0}
  .selrow{display:flex;gap:5px}
  .selrow select{flex:1;min-width:0;font-size:11.5px;padding:5px 6px;background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:7px;font-family:inherit}
  .grp{display:flex;align-items:center;gap:6px;padding:10px 8px 5px;cursor:pointer;user-select:none}
  .grp:hover .gname{color:var(--fg)}
  .gcaret{color:var(--dim);font-size:8px;width:9px;flex:0 0 auto;transition:transform .12s}
  .grp.collapsed .gcaret{transform:rotate(-90deg)}
  .gname{color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gcount{color:var(--dim);font-size:10px;opacity:.7;flex:0 0 auto}
  .gbody.hide{display:none}
  .item .arch{font-size:8.5px;color:var(--dim);font-weight:700;letter-spacing:.4px}
  .nores{color:var(--dim);font-size:12.5px;padding:14px 8px;line-height:1.55}
  .item{display:flex;align-items:center;gap:9px;border-radius:9px;padding:9px 9px;margin-bottom:2px;cursor:pointer;transition:.1s;color:var(--fg)}
  .item:hover{background:var(--card)}
  .item.active{background:var(--accent-soft)}
  .item.active .nm{color:#f0c3b0}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#5c5852}
  .dot.on{background:var(--ok);box-shadow:0 0 7px rgba(123,176,126,.7)}
  .item .nm{font-weight:550;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .item .rc{font-size:9px;color:var(--accent);font-weight:700}
  .side-foot{padding:8px 6px 2px;border-top:1px solid var(--line);margin-top:8px;display:flex;align-items:center;gap:8px}
  .side-foot .host{color:var(--dim);font-size:10.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* main */
  .content{flex:1;overflow-y:auto}
  .inner{max-width:640px;margin:0 auto;padding:26px 26px 60px}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);gap:8px;text-align:center;padding:40px}
  .empty .big{font-size:40px;opacity:.5}
  .back{display:none}
  .d-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .d-title{font-size:24px;font-weight:700;letter-spacing:-.2px}
  .d-folder{color:var(--dim);font-size:12.5px;margin-bottom:20px;word-break:break-all}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 16px;margin-bottom:14px}
  .panel.pad{padding:16px}
  .panel .toggle+.toggle{border-top:1px solid var(--line)}
  pre.out{background:#1c1b19;border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfcbc0;height:260px;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word}
  .pub{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:7px}
  .pub a{color:#e69376;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

  .folderpick{border:1px solid var(--line);border-radius:9px;max-height:260px;overflow:auto;background:var(--card2)}
  .fp-row{display:flex;align-items:center;gap:4px;padding:9px 10px;cursor:pointer;border-bottom:1px solid rgba(65,63,59,.5)}
  .fp-row:hover{background:var(--card)}
  .fp-row.sel{background:var(--accent-soft)}
  .fp-row.sel .fp-name{color:#f0c3b0;font-weight:600}
  .fp-root{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:1;cursor:default}
  .fp-caret{flex:0 0 auto;width:24px;text-align:center;color:#fff;font-size:12px;line-height:1;cursor:pointer;user-select:none}
  .fp-caret:hover{color:var(--accent)}
  .fp-caret.spacer{color:transparent;cursor:default}
  .fp-name{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fp-add{flex:0 0 auto;background:transparent;border:none;color:#cbc7bc;font-size:17px;line-height:1;width:30px;height:30px;cursor:pointer;border-radius:7px}
  .fp-add:hover{background:var(--accent-soft);color:var(--accent)}
  .fp-children.hide{display:none}
  @media(max-width:760px){
    .sidebar{width:100%}
    .content{display:none}
    body.detail-open .sidebar{display:none}
    body.detail-open .content{display:block}
    .back{display:inline-flex}
  }
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen">
  <div class="authbox">
    <div class="logo">⌘</div>
    <h1 id="authTitle">Major Tom</h1>
    <p id="authSub">Enter your password</p>
    <input id="authPw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()">
    <input id="authPw2" class="hide" type="password" placeholder="Confirm password" autocomplete="new-password" style="margin-top:8px" onkeydown="if(event.key==='Enter')doAuth()">
    <button class="btn pri" style="width:100%;justify-content:center;margin-top:12px" onclick="doAuth()" id="authBtn">Unlock</button>
    <p id="authErr" style="color:var(--danger);font-size:12px;margin:10px 0 0;min-height:14px"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="logo">⌘</div><div><div class="t">Major Tom</div><div class="h" id="host">…</div></div></div>
      <button class="btn newbtn" onclick="showNew()">＋&nbsp; New instance</button>
      <div class="tools">
        <div class="search">
          <span class="mag">⌕</span>
          <input id="q" placeholder="Search…" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="onSearch(this.value)">
          <button class="clr hide" id="qclr" onclick="clearSearch()" title="Clear">✕</button>
        </div>
        <div class="chips">
          <button class="chip" id="pf_all" onclick="setUI('power','all')">All</button>
          <button class="chip" id="pf_on" onclick="setUI('power','on')">● On</button>
          <button class="chip" id="pf_off" onclick="setUI('power','off')">Off</button>
        </div>
        <div class="selrow">
          <select id="groupBy" onchange="setUI('groupBy',this.value)" title="Group by">
            <option value="none">No grouping</option>
            <option value="group">By group</option>
            <option value="folder">By project</option>
          </select>
          <select id="sortBy" onchange="setUI('sort',this.value)" title="Sort by">
            <option value="name">A → Z</option>
            <option value="created">Newest</option>
            <option value="updated">Recently changed</option>
          </select>
        </div>
        <div class="chips">
          <button class="chip" id="af_active" onclick="setUI('archived',false)">Active</button>
          <button class="chip" id="af_arch" onclick="setUI('archived',true)">Archived</button>
        </div>
      </div>
      <div class="list" id="list"></div>
      <div class="side-foot"><span class="host" id="host2"></span><button class="btn ghost sm" onclick="refresh()">↻</button><button class="btn ghost sm" onclick="logout()">Lock</button></div>
    </aside>
    <main class="content" id="content"><div class="empty"><div class="big">⌘</div><div>Select an instance to manage it</div></div></main>
  </div>
</div>

<script>
let STATE={instances:[],folders:[],host:''}, current=null, view='empty', outTimer=null, pollTimer=null;

/* ---------- auth ---------- */
let authMode='login';
async function checkAuth(){
  const s=await fetch('/api/auth-status').then(r=>r.json());
  if(!s.configured){ authMode='setup'; document.getElementById('authTitle').textContent='Set a password'; document.getElementById('authSub').textContent='Protect this panel — you’ll enter this on your phone/laptop.'; document.getElementById('authPw').placeholder='New password'; document.getElementById('authPw2').classList.remove('hide'); document.getElementById('authBtn').textContent='Set password'; showAuth(); }
  else if(!s.authed){ authMode='login'; showAuth(); }
  else showApp();
}
function showAuth(){ document.getElementById('app').classList.add('hide'); document.getElementById('authScreen').classList.remove('hide'); if(pollTimer)clearInterval(pollTimer); setTimeout(()=>document.getElementById('authPw').focus(),50); }
async function doAuth(){
  const pw=document.getElementById('authPw').value, err=document.getElementById('authErr'); err.textContent='';
  if(authMode==='setup'){
    if(pw.length<4){err.textContent='At least 4 characters';return;}
    if(pw!==document.getElementById('authPw2').value){err.textContent='Passwords don’t match';return;}
    const r=await fetch('/api/set-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})}).then(r=>r.json());
    if(r.error){err.textContent=r.error;return;} showApp();
  } else {
    const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})});
    if(r.status!==200){err.textContent='Wrong password';return;} showApp();
  }
}
async function logout(){ await fetch('/api/logout',{method:'POST'}); document.getElementById('authPw').value=''; authMode='login'; document.getElementById('authPw2').classList.add('hide'); document.getElementById('authTitle').textContent='Major Tom'; document.getElementById('authSub').textContent='Enter your password'; document.getElementById('authBtn').textContent='Unlock'; showAuth(); }
function showApp(){ document.getElementById('authScreen').classList.add('hide'); document.getElementById('app').classList.remove('hide'); refresh(); if(pollTimer)clearInterval(pollTimer); pollTimer=setInterval(()=>{if(!document.hidden)refresh();},5000); }

/* ---------- api ---------- */
async function api(path,method='GET',bodyObj){
  const r=await fetch('/api'+path,{method,headers:{'content-type':'application/json'},body:bodyObj?JSON.stringify(bodyObj):undefined});
  if(r.status===401){ showAuth(); throw new Error('unauth'); }
  return r.json();
}

/* ---------- sidebar view state (search / filter / group / sort) ----------
   Persisted in localStorage. The controls live OUTSIDE #list because refresh()
   rewrites #list every 5s — a search box inside it would lose focus mid-typing. */
const UI_KEY='mt.ui.v1';
let UI={q:'',power:'all',sort:'name',groupBy:'group',archived:false,collapsed:{}};
try{ Object.assign(UI, JSON.parse(localStorage.getItem(UI_KEY)||'{}')); }catch{}
UI.q='';   // a stale search from last session would look like data loss
function saveUI(){ try{ localStorage.setItem(UI_KEY,JSON.stringify(UI)); }catch{} }
function setUI(k,v){ UI[k]=v; saveUI(); renderList(); }
function onSearch(v){ UI.q=v; renderList(); }
function clearSearch(){ const el=document.getElementById('q'); el.value=''; UI.q=''; renderList(); el.focus(); }
function toggleGroup(k){ UI.collapsed[k]=!UI.collapsed[k]; saveUI(); renderList(); }
function syncTools(){
  const q=document.getElementById('q'); if(q&&document.activeElement!==q) q.value=UI.q;
  document.getElementById('qclr').classList.toggle('hide',!UI.q);
  for(const v of ['all','on','off']) document.getElementById('pf_'+v).classList.toggle('on',UI.power===v);
  document.getElementById('af_active').classList.toggle('on',!UI.archived);
  document.getElementById('af_arch').classList.toggle('on',!!UI.archived);
  document.getElementById('groupBy').value=UI.groupBy;
  document.getElementById('sortBy').value=UI.sort;
}
// Derived grouping: first path segment under ~/Projects (acme/apps/api → acme).
function folderGroup(i){
  const root=(STATE.projectsRoot||'')+'/';
  let rel=i.folder||'';
  if(rel.startsWith(root)) rel=rel.slice(root.length);
  return rel.split('/').filter(Boolean)[0] || '(root)';
}
const SORTS={
  name:(a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}),
  created:(a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')),
  updated:(a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')),
};
function itemHTML(i){
  return `<div class="item ${current===i.name?'active':''}" onclick="selectInstance('${i.name}')">
      <span class="dot ${i.running?'on':''}"></span>
      <span class="nm">${esc(i.name)}</span>
      ${i.hostId&&i.hostId!==STATE.selfHost?`<span class="hostb">${esc(i.hostLabel||i.hostId)}</span>`:''}
      ${i.remoteControl?'<span class="rc">RC</span>':''}
      ${i.archived?'<span class="arch">ARCH</span>':''}
    </div>`;
}
function emptyMsg(all){
  if(!all.length) return 'No instances yet.';
  if(UI.archived && !all.some(i=>i.archived)) return 'Nothing archived yet. Archive an instance from its page to park it here.';
  const bits=[];
  if(UI.power==='on') bits.push('running');
  if(UI.power==='off') bits.push('stopped');
  if(UI.q) bits.push(`matching “${esc(UI.q)}”`);
  return `No ${UI.archived?'archived ':''}instances ${bits.join(' ')||'to show'}.`;
}
function renderList(){
  const list=document.getElementById('list'); if(!list) return;
  syncTools();
  const all=STATE.instances||[];
  const q=UI.q.trim().toLowerCase();
  let items=all.filter(i=>!!i.archived===!!UI.archived);
  if(UI.power==='on') items=items.filter(i=>i.running);
  else if(UI.power==='off') items=items.filter(i=>!i.running);
  if(q) items=items.filter(i=>
    i.name.toLowerCase().includes(q) ||
    (i.group||'').toLowerCase().includes(q) ||
    (i.folder||'').toLowerCase().includes(q));
  items.sort(SORTS[UI.sort]||SORTS.name);

  if(!items.length){ list.innerHTML=`<div class="nores">${emptyMsg(all)}</div>`; return; }
  if(UI.groupBy==='none'){ list.innerHTML=items.map(itemHTML).join(''); return; }

  const keyOf = UI.groupBy==='folder' ? folderGroup : (i=>i.group||'Ungrouped');
  const buckets=new Map();
  for(const i of items){ const k=keyOf(i); if(!buckets.has(k)) buckets.set(k,[]); buckets.get(k).push(i); }
  const keys=[...buckets.keys()].sort((a,b)=>
    a==='Ungrouped'?1 : b==='Ungrouped'?-1 : a.localeCompare(b,undefined,{sensitivity:'base'}));
  list.innerHTML=keys.map(k=>{
    const rows=buckets.get(k), col=!!UI.collapsed[k];
    const arg=esc(JSON.stringify(k));
    return `<div class="grp${col?' collapsed':''}" onclick="toggleGroup(${arg})">
        <span class="gcaret">▼</span><span class="gname">${esc(k)}</span><span class="gcount">${rows.length}</span>
      </div>
      <div class="gbody${col?' hide':''}">${rows.map(itemHTML).join('')}</div>`;
  }).join('');
}

/* ---------- sidebar ---------- */
async function refresh(){
  let d; try{ d=await api('/state'); }catch{ return; }
  STATE=d; document.getElementById('host').textContent=d.host||''; document.getElementById('host2').textContent=d.host||'';
  renderList();
  if(view==='detail'){ const inst=d.instances.find(x=>x.name===current); if(!inst){ showEmpty(); } else updateDetailLive(inst); }
}

/* ---------- main: empty / detail / new ---------- */
function setMain(html){ document.getElementById('content').innerHTML=html; }
function stopPoll(){ if(outTimer)clearInterval(outTimer); outTimer=null; }
function showEmpty(){ view='empty'; current=null; stopPoll(); document.body.classList.remove('detail-open'); setMain('<div class="empty"><div class="big">⌘</div><div>Select an instance to manage it</div></div>'); refreshSidebarActive(); }
function refreshSidebarActive(){ document.querySelectorAll('.item').forEach(el=>el.classList.remove('active')); }

function selectInstance(name){
  current=name; view='detail'; const inst=STATE.instances.find(i=>i.name===name); if(!inst)return;
  document.body.classList.add('detail-open');
  setMain(detailHTML(inst));
  document.querySelectorAll('.item').forEach(el=>el.classList.toggle('active', el.querySelector('.nm')?.textContent===name));
  stopPoll(); loadOutput(); outTimer=setInterval(loadOutput,2500);
}
function detailHTML(i){
  const r=i.running;
  const pubs=(i.publishedPorts||[]).map(p=>`<div class="pub"><span>:${p.port}</span><a href="${p.url}" target="_blank">${p.url}</a><button class="btn ghost sm" onclick="unpublish(${p.port})">✕</button></div>`).join('');
  return `
  <div class="inner">
    <button class="btn ghost sm back" onclick="showEmpty()" style="margin-bottom:14px">‹ Instances</button>
    <div class="d-head">
      <span class="dot ${r?'on':''}" id="d_dot" style="width:10px;height:10px"></span>
      <span class="d-title">${i.name}</span>
      <span id="d_pills" style="display:flex;gap:6px">${r?'<span class="pill on">RUNNING</span>':'<span class="pill off">STOPPED</span>'}${i.claudeRunning?' <span class="pill cl">claude</span>':''}</span>
    </div>
    <div class="d-folder">${i.folder}</div>
    <div class="panel pad">
      <div class="mini">Host</div>
      <select id="d_host" onchange="setHost(this.value)" ${r?'disabled':''}>
        ${(STATE.hosts||[]).map(h=>`<option value="${esc(h.id)}" ${h.id===i.hostId?'selected':''}>${esc(h.label)}${h.local?' — this machine':''}</option>`).join('')}
      </select>
      <div style="color:var(--dim);font-size:11px;margin-top:5px">${r?'Power the instance off to move it — its tmux session lives on the current host.':'Where this instance\u2019s tmux session runs. The folder path is not migrated.'}</div>
    </div>

    <div class="panel">
      <div class="toggle"><span><b>Power</b> &nbsp;<span style="color:var(--dim);font-size:12px">run this instance</span></span><label class="sw"><input type="checkbox" id="d_power" ${r?'checked':''} onchange="power(this.checked)"><span class="track"></span></label></div>
      <div class="toggle"><span>Auto-start on boot</span><label class="sw"><input type="checkbox" id="d_auto" ${i.autostart?'checked':''} onchange="toggleAuto(this.checked)"><span class="track"></span></label></div>
      <div class="toggle"><span>Remote-control</span><label class="sw"><input type="checkbox" id="d_remote" ${i.remoteControl?'checked':''} onchange="toggleRemote(this.checked)"><span class="track"></span></label></div>
      <div class="toggle"><span>Resume conversation &nbsp;<span style="color:var(--dim);font-size:12px">on every power-on</span></span><label class="sw"><input type="checkbox" id="d_resume" ${i.resume!==false?'checked':''} onchange="toggleResume(this.checked)"><span class="track"></span></label></div>
      <div class="toggle" id="d_healrow" style="${(r&&i.startClaude&&!i.claudeRunning)?'':'display:none'}"><span style="color:var(--warn,#e0a030);font-size:12px">Session is up but Claude is not running</span><button class="btn sm pri" onclick="startClaude()">Start Claude</button></div>
    </div>

    <div class="panel pad">
      <div class="mini">Group</div>
      <input id="d_group" list="grouplist" placeholder="e.g. Work, Personal, Infra" value="${esc(i.group||'')}" onchange="setGroup(this.value)">
      <datalist id="grouplist">${groupOptions()}</datalist>
      <div style="color:var(--dim);font-size:11px;margin-top:5px">Drives “By group” in the sidebar. Blank = Ungrouped.</div>
    </div>

    <div class="panel pad">
      <div class="mini">Obsidian vault folder</div>
      <input id="d_vault" list="vaultlist" placeholder="e.g. clients/acme" value="${i.vaultFolder || ''}" onchange="setVault(this.value)">
      <datalist id="vaultlist">${(STATE.vaultFolders || []).map((f) => `<option value="${f}">`).join('')}</datalist>
      <div style="color:var(--dim);font-size:11px;margin-top:5px">Gives this instance's Claude <code>--add-dir</code> access to that vault folder. Needs Full Disk Access granted to node (see setup).</div>
    </div>

    <div class="panel pad">
      <div class="row">
        <button class="btn sm" id="d_term" ${r?'':'disabled'} onclick="openTerminal()">▸ Terminal</button>
        <button class="btn sm ghost" id="d_exit" ${r?'':'disabled'} onclick="exitClaude()">Exit Claude</button>
        <button class="btn sm ghost" id="d_arch" onclick="toggleArchive()">${i.archived?'Unarchive':'Archive'}</button>
        <button class="btn sm danger" style="margin-left:auto" onclick="del()">Delete</button>
      </div>
    </div>

    <div class="panel pad">
      <div class="mini">Send command</div>
      <div class="row"><input id="d_cmd" placeholder="e.g. npm run dev" onkeydown="if(event.key==='Enter')send()"><button class="btn sm pri" onclick="send()">Send</button></div>
    </div>

    <div class="panel pad">
      <div class="mini">Publish a port — view on your phone</div>
      <div class="row"><input id="d_port" placeholder="e.g. 3000" inputmode="numeric" onkeydown="if(event.key==='Enter')publish()"><button class="btn sm" onclick="publish()">Publish</button></div>
      <div id="d_pubs">${pubs}</div>
    </div>

    <div class="panel pad">
      <div class="mini">Custom commands</div>
      <div id="d_cmdlist">${commandsListHTML(i)}</div>
      <div id="d_addcmd" class="hide" style="margin-top:10px">${addCmdHTML()}</div>
      <button class="btn sm" id="d_addbtn" style="margin-top:10px" onclick="toggleAddCmd()">＋ Add command</button>
    </div>

    <div class="panel pad">
      <div class="mini">Live output</div>
      <pre class="out" id="d_out">…</pre>
    </div>
  </div>`;
}
function schedText(a){ return a.schedule && a.schedule.time ? `⏱ ${a.schedule.days||'daily'} ${a.schedule.time}` : 'manual only'; }
function commandsListHTML(i){
  const lib=STATE.commandsLibrary||[]; const list=i.commands||[];
  if(!list.length) return '<div style="color:var(--dim);font-size:12px">No commands attached yet.</div>';
  return list.map(a=>{ const c=lib.find(x=>x.id===a.commandId)||{name:'(deleted command)',kind:'?'};
    const lr=a.lastRun?` · last: ${a.lastRun.status}`:'';
    return `<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600">${c.name} <span class="pill ${c.kind==='shell'?'off':'cl'}">${c.kind}${c.kind==='claude'?' · '+(c.runMode==='live'?'live':'headless'):''}</span></div>
        <div style="color:var(--dim);font-size:11px">${schedText(a)}${lr}</div>
      </div>
      <button class="btn sm" onclick="runAtt('${a.attachId}')">Run</button>
      <button class="btn sm ghost" title="schedule" onclick="editSched('${a.attachId}')">⏱</button>
      <button class="btn ghost sm" onclick="removeAtt('${a.attachId}')">✕</button>
    </div>`; }).join('');
}
function addCmdHTML(){
  const lib=STATE.commandsLibrary||[];
  return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px">
    <label class="fld">Attach a saved command</label>
    <div class="row"><select id="ac_saved" style="flex:1">${lib.map(c=>`<option value="${c.id}">${c.name} (${c.kind})</option>`).join('')||'<option value="">— none saved yet —</option>'}</select><button class="btn sm pri" onclick="attachSaved()">Attach</button></div>
    <div style="border-top:1px solid var(--line);margin:12px 0 0;padding-top:12px">
      <label class="fld">…or create a new command</label>
      <input id="ac_name" placeholder="Name (e.g. Update docs)">
      <div class="row" style="margin-top:6px"><select id="ac_kind" onchange="acKindChange()" style="flex:1"><option value="claude">Claude prompt</option><option value="shell">Shell command</option></select></div>
      <textarea id="ac_text" placeholder="The prompt or shell command…" style="width:100%;margin-top:6px;min-height:60px;background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:9px;font-family:inherit;font-size:14px"></textarea>
      <div class="row" id="ac_claudeopts" style="margin-top:6px">
        <select id="ac_runmode" style="flex:1"><option value="headless">Headless (autonomous)</option><option value="live">Into live session</option></select>
        <select id="ac_perm" style="flex:1"><option value="acceptEdits">Accept edits</option><option value="full">Full autonomy</option></select>
      </div>
    </div>
    <label class="fld" style="margin-top:12px">Schedule (optional — leave time blank for manual)</label>
    <div class="row"><input id="ac_time" type="time" style="max-width:140px"><select id="ac_days"><option value="daily">daily</option><option value="weekdays">weekdays</option></select></div>
    <div class="row" style="margin-top:10px"><button class="btn sm pri" onclick="createAttach()">Create &amp; attach</button><button class="btn ghost sm" onclick="toggleAddCmd()">Close</button></div>
    <p id="ac_err" style="color:var(--danger);font-size:12px;margin:8px 0 0"></p>
  </div>`;
}
function updateDetailLive(i){
  const r=i.running;
  const dot=document.getElementById('d_dot'); if(dot)dot.className='dot'+(r?' on':'');
  const pills=document.getElementById('d_pills'); if(pills)pills.innerHTML=`${r?'<span class="pill on">RUNNING</span>':'<span class="pill off">STOPPED</span>'}${i.claudeRunning?' <span class="pill cl">claude</span>':''}`;
  const set=(id,v)=>{const el=document.getElementById(id); if(el&&document.activeElement!==el)el.checked=v;};
  set('d_power',r); set('d_auto',i.autostart); set('d_remote',i.remoteControl); set('d_resume',i.resume!==false);
  const hr=document.getElementById('d_healrow'); if(hr) hr.style.display=(r&&i.startClaude&&!i.claudeRunning)?'':'none';
  const t=document.getElementById('d_term'),e=document.getElementById('d_exit'); if(t)t.disabled=!r; if(e)e.disabled=!r;
  const gb=document.getElementById('d_group'); if(gb&&document.activeElement!==gb) gb.value=i.group||'';
  const ab=document.getElementById('d_arch'); if(ab) ab.textContent=i.archived?'Unarchive':'Archive';
  const pubs=document.getElementById('d_pubs'); if(pubs)pubs.innerHTML=(i.publishedPorts||[]).map(p=>`<div class="pub"><span>:${p.port}</span><a href="${p.url}" target="_blank">${p.url}</a><button class="btn ghost sm" onclick="unpublish(${p.port})">✕</button></div>`).join('');
  const cl=document.getElementById('d_cmdlist'), ap=document.getElementById('d_addcmd');
  if(cl && ap && ap.classList.contains('hide')) cl.innerHTML=commandsListHTML(i);   // refresh statuses only when add-form is closed
}
async function loadOutput(){ if(view!=='detail'||!current)return; try{ const r=await api(`/instances/${current}/output`); const el=document.getElementById('d_out'); if(el){const b=el.scrollTop+el.clientHeight>=el.scrollHeight-20; el.textContent=r.output||''; if(b)el.scrollTop=el.scrollHeight;} }catch{} }

/* ---------- actions ---------- */
async function power(on){ await api(`/instances/${current}/power`,'POST',{on}); refresh(); setTimeout(loadOutput,700); }
async function toggleAuto(on){ await api(`/instances/${current}/autostart`,'POST',{on}); }
async function toggleRemote(on){ await api(`/instances/${current}/remote-control`,'POST',{on}); setTimeout(loadOutput,700); }
async function toggleResume(on){ await api(`/instances/${current}/resume`,'POST',{on}); }
async function setHost(h){ const r=await api(`/instances/${current}/host`,'POST',{host:h}); if(r.error){alert(r.error);} await refresh(); if(current) selectInstance(current); }
async function startClaude(){ await api(`/instances/${current}/power`,'POST',{on:true}); refresh(); setTimeout(loadOutput,900); }
async function exitClaude(){ await api(`/instances/${current}/exit-claude`,'POST',{}); setTimeout(()=>{refresh();loadOutput();},700); }
async function send(){ const el=document.getElementById('d_cmd'); const v=el.value; if(!v)return; await api(`/instances/${current}/send`,'POST',{keys:v}); el.value=''; setTimeout(loadOutput,500); }
async function openTerminal(){ const r=await api(`/instances/${current}/terminal`,'POST',{}); if(r.path) window.open(r.path,'_blank'); else alert(r.error||'not running'); }
async function publish(){ const el=document.getElementById('d_port'); const port=parseInt(el.value,10); if(!port)return; const r=await api(`/instances/${current}/publish`,'POST',{port}); el.value=''; if(r.err&&!r.ok)alert('publish failed: '+r.err); refresh(); }
async function unpublish(port){ await api(`/instances/${current}/publish`,'DELETE',{port}); refresh(); }
async function del(){ if(!confirm(`Delete instance “${current}”? (folder is kept)`))return; await api(`/instances/${current}`,'DELETE'); showEmpty(); refresh(); }
async function setVault(v){ await api(`/instances/${current}/vault`,'POST',{folder:v.trim()||null}); }
function groupOptions(){ return [...new Set((STATE.instances||[]).map(i=>i.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).map(g=>`<option value="${esc(g)}">`).join(''); }
async function setGroup(v){ await api(`/instances/${current}/group`,'POST',{group:v.trim()||null}); refresh(); }
async function toggleArchive(){
  const i=STATE.instances.find(x=>x.name===current); if(!i)return;
  const on=!i.archived;
  if(on && i.running && !confirm(`“${current}” is running. Archiving powers it off. Continue?`)) return;
  await api(`/instances/${current}/archive`,'POST',{on});
  await refresh(); if(current) selectInstance(current);
}

/* ---- custom commands ---- */
function toggleAddCmd(){ const p=document.getElementById('d_addcmd'); p.classList.toggle('hide'); document.getElementById('d_addbtn').classList.toggle('hide',!p.classList.contains('hide')); }
function acKindChange(){ const shell=document.getElementById('ac_kind').value==='shell'; document.getElementById('ac_claudeopts').style.display=shell?'none':'flex'; }
function schedFromPanel(){ const t=(document.getElementById('ac_time').value||'').trim(); return t?{time:t,days:document.getElementById('ac_days').value}:null; }
async function attachSaved(){ const id=document.getElementById('ac_saved').value; if(!id){alert('No saved command selected');return;} await api(`/instances/${current}/commands`,'POST',{commandId:id,schedule:schedFromPanel()}); reopenDetail(); }
async function createAttach(){
  const name=document.getElementById('ac_name').value.trim(), text=document.getElementById('ac_text').value.trim(), err=document.getElementById('ac_err'); err.textContent='';
  if(!name||!text){err.textContent='Name and text are required';return;}
  const kind=document.getElementById('ac_kind').value;
  const payload={name,text,kind,runMode:document.getElementById('ac_runmode').value,permission:document.getElementById('ac_perm').value};
  const c=await api('/commands','POST',payload); if(c.error){err.textContent=c.error;return;}
  await api(`/instances/${current}/commands`,'POST',{commandId:c.id,schedule:schedFromPanel()});
  reopenDetail();
}
async function runAtt(id){ const r=await api(`/instances/${current}/commands/${id}/run`,'POST',{}); setTimeout(()=>{loadOutput();reopenDetail();},600); }
async function removeAtt(id){ await api(`/instances/${current}/commands/${id}`,'DELETE'); reopenDetail(); }
async function editSched(id){
  const t=prompt('Run time HH:MM (24h). Leave blank for manual only:','02:00'); if(t===null)return;
  let schedule=null;
  if(t.trim()){ const days=(prompt('Days: daily or weekdays','daily')||'daily').trim(); schedule={time:t.trim(),days:days==='weekdays'?'weekdays':'daily'}; }
  await api(`/instances/${current}/commands/${id}`,'PATCH',{schedule}); reopenDetail();
}
async function reopenDetail(){ await refresh(); if(current) selectInstance(current); }

/* ---------- new instance (inline in main) ---------- */
function showNew(){
  view='new'; current=null; stopPoll(); document.body.classList.add('detail-open'); refreshSidebarActive();
  setMain(`
  <div class="inner">
    <button class="btn ghost sm back" onclick="showEmpty()" style="margin-bottom:14px">‹ Instances</button>
    <div class="d-title" style="margin-bottom:20px">New instance</div>
    <div class="panel pad">
      <label class="fld">Host — where this instance's tmux session runs</label>
      <select id="n_host" onchange="hostChanged()" style="width:100%;margin-bottom:14px">
        ${(STATE.hosts||[]).map(h=>`<option value="${esc(h.id)}" ${h.id===(STATE.selfHost||'')?'selected':''}>${esc(h.label)}${h.local?' — this machine':''}</option>`).join('')}
      </select>
      <label class="fld">Instance name</label>
      <input id="n_name" placeholder="e.g. web-app or new-idea" autocapitalize="off" autocomplete="off" oninput="updateFolderSel()">
      <label class="fld" style="margin-top:14px">Folder — tap a folder to select · tap ＋ to create one inside it</label>
      <div id="n_folderinfo" style="font-size:12px;color:var(--dim);margin-bottom:6px">No folder selected</div>
      <div class="folderpick" id="n_foldertree"></div>
      <label class="fld" style="margin-top:14px">Group (optional)</label>
      <input id="n_group" list="grouplist" placeholder="e.g. Work, Personal, Infra" autocomplete="off">
      <datalist id="grouplist">${groupOptions()}</datalist>
      <label class="fld" style="margin-top:14px">Obsidian vault folder (optional)</label>
      <input id="n_vault" list="vaultlist" placeholder="e.g. clients/acme">
      <datalist id="vaultlist">${(STATE.vaultFolders||[]).map(f=>`<option value="${f}">`).join('')}</datalist>
    </div>
    <div class="panel">
      <div class="toggle"><span>Start now &amp; launch Claude</span><label class="sw"><input type="checkbox" id="n_startnow" checked><span class="track"></span></label></div>
      <div class="toggle"><span>Auto-start on boot (persist)</span><label class="sw"><input type="checkbox" id="n_autostart"><span class="track"></span></label></div>
      <div class="toggle"><span>Enable remote-control</span><label class="sw"><input type="checkbox" id="n_remote"><span class="track"></span></label></div>
      <div class="toggle"><span>Resume conversation on power-on</span><label class="sw"><input type="checkbox" id="n_resume" checked><span class="track"></span></label></div>
    </div>
    <div class="row"><button class="btn pri" style="flex:1;justify-content:center" onclick="create()">Create instance</button><button class="btn ghost" onclick="showEmpty()">Cancel</button></div>
    <p id="n_err" style="color:var(--danger);font-size:12px;margin:10px 0 0"></p>
  </div>`);
  selectedFolder=null; renderFolderTree(); updateFolderSel(); hostChanged();
  setTimeout(()=>document.getElementById('n_name').focus(),50);
}
/* ---- folder tree picker ---- */
let selectedFolder=null, newHostFolders=null;
function newHostId(){ const el=document.getElementById('n_host'); return el?el.value:(STATE.selfHost||''); }
async function hostChanged(){
  const c=document.getElementById('n_foldertree'); if(c) c.innerHTML='<div style="color:var(--dim);font-size:12px;padding:10px">Loading folders…</div>';
  selectedFolder=null;
  try{ const d=await api(`/state?host=${encodeURIComponent(newHostId())}`); newHostFolders=d.folders||[]; }
  catch{ newHostFolders=[]; }
  renderFolderTree(); updateFolderSel();
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function buildTree(paths){ const root={}; for(const p of paths){ let node=root; for(const part of p.split('/')){ node[part]=node[part]||{}; node=node[part]; } } return root; }
function renderLevel(node, prefix, depth){
  return Object.keys(node).sort((a,b)=>a.localeCompare(b)).map(name=>{
    const path=prefix?`${prefix}/${name}`:name; const has=Object.keys(node[name]).length>0;
    const caret = has ? `<span class="fp-caret" data-act="exp">▶</span>` : `<span class="fp-caret spacer">·</span>`;
    return `<div class="fp-item">
      <div class="fp-row" data-act="pick" data-path="${esc(path)}" style="padding-left:${8+depth*16}px">
        ${caret}<span class="fp-name">${esc(name)}</span>
        <button type="button" class="fp-add" data-act="add" data-path="${esc(path)}" title="new folder inside ${esc(name)}">＋</button>
      </div>
      ${has?`<div class="fp-children hide">${renderLevel(node[name], path, depth+1)}</div>`:''}
    </div>`;
  }).join('');
}
function renderFolderTree(){
  const c=document.getElementById('n_foldertree'); if(!c)return;
  const root=`<div class="fp-row fp-root"><span class="fp-caret spacer">·</span><span class="fp-name">Projects <span style="color:var(--dim);font-weight:400;font-size:12px">~/Projects</span></span><button type="button" class="fp-add" data-act="add" data-path="" title="new folder under Projects">＋</button></div>`;
  c.innerHTML=root + (renderLevel(buildTree(newHostFolders||STATE.folders||[]), '', 0) || '<div style="color:var(--dim);font-size:12px;padding:10px">No project folders yet.</div>');
  c.onclick=(e)=>{
    const el=e.target.closest('[data-act]'); if(!el)return;
    const act=el.dataset.act;
    if(act==='exp'){ const item=el.closest('.fp-item'); const kids=item.querySelector(':scope > .fp-children'); if(kids){ kids.classList.toggle('hide'); el.textContent=kids.classList.contains('hide')?'▶':'▼'; } return; }
    if(act==='add'){ addFolder(el.getAttribute('data-path')); return; }
    const row=el.closest('.fp-row'); selectedFolder=row.getAttribute('data-path');
    c.querySelectorAll('.fp-row.sel').forEach(r=>r.classList.remove('sel')); row.classList.add('sel');
    updateFolderSel();
  };
}
async function addFolder(parent){
  const nm=prompt(`New folder name ${parent?`inside "${parent}"`:'under Projects'}:`); if(nm===null)return;
  const clean=nm.trim().replace(/[\/\\]/g,'').replace(/^\.+/,''); if(!clean)return;
  const path=parent?`${parent}/${clean}`:clean;
  // Create it on the host this instance will run on, not always the local one.
  const r=await api('/mkdir','POST',{path,host:newHostId()});
  if(r.error){ alert('Could not create folder: '+r.error); return; }
  // Re-list from that same host — refresh() only ever returns the local tree.
  try{ const d=await api(`/state?host=${encodeURIComponent(newHostId())}`); newHostFolders=d.folders||[]; }catch{}
  renderFolderTree(); selectedFolder=r.path||path; revealSelected(); updateFolderSel();
}
function revealSelected(){
  const c=document.getElementById('n_foldertree'); if(!c||!selectedFolder)return;
  const row=[...c.querySelectorAll('.fp-row')].find(r=>r.getAttribute('data-path')===selectedFolder); if(!row)return;
  row.classList.add('sel');
  let item=row.closest('.fp-item');
  while(item){ const kids=item.parentElement&&item.parentElement.closest('.fp-children'); if(!kids)break; kids.classList.remove('hide'); const pItem=kids.closest('.fp-item'); const caret=pItem&&pItem.querySelector(':scope > .fp-row > .fp-caret'); if(caret&&caret.dataset.act==='exp')caret.textContent='▼'; item=pItem; }
  row.scrollIntoView({block:'nearest'});
}
function updateFolderSel(){ const el=document.getElementById('n_folderinfo'); if(!el)return;
  el.innerHTML = selectedFolder ? `Selected: <b style="color:var(--fg)">${esc(selectedFolder)}</b>` : 'No folder selected — tap a folder, or ＋ to create one.'; }
async function create(){
  const name=document.getElementById('n_name').value.trim(), err=document.getElementById('n_err'); err.textContent='';
  if(!name){err.textContent='Name is required';return;}
  if(!selectedFolder){err.textContent='Tap a folder to select it (or ＋ to create one)';return;}
  const payload={name,host:newHostId(),folder:selectedFolder,startNow:document.getElementById('n_startnow').checked,autostart:document.getElementById('n_autostart').checked,remoteControl:document.getElementById('n_remote').checked,resume:document.getElementById('n_resume').checked,startClaude:document.getElementById('n_startnow').checked,vaultFolder:(document.getElementById('n_vault').value||'').trim()||null,group:(document.getElementById('n_group').value||'').trim()||null};
  const r=await api('/instances','POST',payload);
  if(r.error){err.textContent=r.error;return;}
  await refresh(); selectInstance(r.name);
}

checkAuth();
</script>
</body>
</html>
